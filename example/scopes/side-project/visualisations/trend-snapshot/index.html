<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trend snapshot</title>
<style>
  body{font-family:Georgia,serif;background:#F7F5F2;color:#161513;padding:3rem;max-width:640px;margin:0 auto}
  h1{font-size:1.4rem} .bar{background:#BA432F;height:18px;border-radius:3px;margin:.4rem 0}
  .row{display:grid;grid-template-columns:160px 1fr;gap:.8rem;align-items:center;font-size:.85rem}
</style>
</head>
<body>
<h1>Trend snapshot</h1>
<p>What the weekly scan has noticed, by mention count.</p>
<div class="row"><span>Local-first tools</span><div class="bar" style="width:82%"></div></div>
<div class="row"><span>Agent dashboards</span><div class="bar" style="width:64%"></div></div>
<div class="row"><span>Markdown substrates</span><div class="bar" style="width:41%"></div></div>
</body>
</html>
