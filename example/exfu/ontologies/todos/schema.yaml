# Ontology schema: todos
# Used by librarians and the install agent to validate folder conformance.

ontology: todos
user-facing: true
applies-to-folder-name: todos
variants:
  - flat-checklist
  - structured-records
default-variant: flat-checklist

required-files:
  - name: agent.md
    purpose: convention snapshot copied from exfu/ontologies/todos/agent.md
  - name: README.md
    purpose: human-facing description (Purpose/Contents/Dependencies)

variant-specific:
  flat-checklist:
    required-files:
      - name: todos.md
        purpose: the checklist itself
    forbidden-files: []
  structured-records:
    required-subfolders:
      - name: open
        purpose: one file per active todo
      - name: done
        purpose: one file per completed todo
    file-shape:
      frontmatter-required: true
      frontmatter-fields:
        - due-date
        - description
        - status

elicitation-prompt: exfu/ontologies/todos/elicitation.md

# Notes for schema readers
# - "user-facing: true" means this type is offered to the user during install
#   via the elicitation prompt. Infrastructure types set this to false.
# - "applies-to-folder-name: todos" is the discovery rule: any folder named
#   `todos/` at any tier is treated as an instance of this ontology.
# - Variants are alternative shapes the user picks between at folder creation.
#   Each variant carries its own required-files set.
